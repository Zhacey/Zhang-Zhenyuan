<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜数字小游戏</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body{background-color:#f0f6ff;padding:30px;text-align:center;}
        .container{max-width:600px;margin:0 auto;background:white;padding:35px;border-radius:16px;box-shadow:0 4px 12px #cce0f5;}
        h1{color:#2c5c97;margin-bottom:10px;font-size:24px;}
        .game-area{margin:20px 0;}
        #tip{font-size:18px;margin:20px 0;color:#333;font-weight:bold;min-height:26px;}
        input{padding:10px;width:180px;font-size:16px;border:2px solid #94b8e8;border-radius:8px;outline:none;text-align:center;}
        .btn-group{margin-top:25px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
        button{padding:11px 18px;border:none;border-radius:8px;font-size:15px;cursor:pointer;transition:0.2s;}
        #submit{background:#2c5c97;color:white;}
        #reset{background:#e67e22;color:white;}
        #hint{background:#27ae60;color:white;}
        #countBtn{background:#9b59b6;color:white;}
        button:hover{opacity:0.85;transform:scale(1.03);}
        .record{margin-top:25px;text-align:left;background:#f7faff;padding:15px;border-radius:10px;}
        .record h3{color:#2c5c97;margin-bottom:8px;}
        #log{font-size:14px;color:#444;max-height:140px;overflow-y:auto;}
    </style>
</head>
<body>
<div class="container">
    <h1>猜数字小游戏</h1>

    <div class="game-area">
        <p>系统随机生成 1~100 的整数，请输入你的猜测：</p>
        <input type="number" id="numInput" placeholder="输入数字" min="1" max="100">
        <div id="tip">游戏即将开始，点击按钮开始挑战！</div>

        <div class="btn-group">
            <button id="submit">提交猜测</button>
            <button id="reset">重新开局</button>
            <button id="hint">获取提示</button>
            <button id="countBtn">查看猜测次数</button>
        </div>
    </div>

    <div class="record">
        <h3>猜测记录</h3>
        <div id="log"></div>
    </div>
</div>

<script>
    let answer = 0;
    let count = 0;
    let logDom = document.getElementById("log");
    let tipDom = document.getElementById("tip");
    let inputDom = document.getElementById("numInput");

    function initGame(){
        answer = Math.floor(Math.random() * 100) + 1;
        count = 0;
        tipDom.innerText = "新游戏开始！请输入1~100数字";
        logDom.innerHTML = "";
        inputDom.value = "";
    }

    document.getElementById("submit").onclick = function(){
        let val = parseInt(inputDom.value);
        if(isNaN(val) || val<1 || val>100){
            tipDom.innerText = "请输入1到100之间有效数字！";
            return;
        }
        count++;
        let msg = "";
        if(val === answer){
            msg = `🎉恭喜！猜对啦！答案就是${val}，一共猜了${count}次`;
        }else if(val < answer){
            msg = `❌数字偏小，再试试！`;
        }else{
            msg = `❌数字偏大，再试试！`;
        }
        tipDom.innerText = msg;
        logDom.innerHTML += `第${count}次：${val} → ${msg}<br/>`;
    }

    document.getElementById("reset").onclick = initGame;

    document.getElementById("hint").onclick = function(){
        let low = answer - 5;
        let high = answer +5;
        tipDom.innerText = `💡提示：答案在 ${low} ~ ${high} 之间`;
    }

    document.getElementById("countBtn").onclick = function(){
        tipDom.innerText = `📊当前已经猜测：${count} 次`;
    }

    initGame();
</script>
</body>
</html>
